version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: banking-db
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_pass
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - banking-network

volumes:
  postgres-data:

networks:
  banking-network: